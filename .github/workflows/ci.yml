name: CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: txc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows x64 build and package
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned toolchains
        id: toolchain_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/txc-toolchains
          key: windows-2022-toolchains-${{ hashFiles('scripts/setup_ci.ps1') }}
      - name: Set up GCC and LLVM
        id: toolchains
        run: ./scripts/setup_ci.ps1
      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: windows-2022-ccache-${{ hashFiles('scripts/setup_ci.ps1', 'CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-ccache-${{ hashFiles('scripts/setup_ci.ps1', 'CMakeLists.txt', 'cmake/**') }}-
      - name: Build compiler and both standard libraries
        id: build
        run: ./scripts/build.ps1
      - name: Check package compatibility
        run: python -X utf8 scripts/check_package_compatibility.py
      - name: Create release ZIP
        env:
          TXC_REF: ${{ github.ref_name }}
          TXC_REF_TYPE: ${{ github.ref_type }}
          TXC_COMMIT: ${{ github.sha }}
        run: python -X utf8 scripts/package_release.py
      - name: Verify extracted ZIP without the build toolchain
        run: python -X utf8 scripts/check_ci_package.py
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: txc-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
            build/compile_commands.json
          if-no-files-found: ignore
      - name: Save toolchains even after build failure
        if: always() && steps.toolchains.outcome == 'success' && steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/txc-toolchains
          key: ${{ steps.toolchain_cache.outputs.cache-primary-key }}
      - name: Save completed compilation work
        if: always() && steps.build.outcome != 'skipped' && steps.compiler_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

  linux:
    name: Linux x64 build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux toolchain and native dependencies
        run: sudo python3 scripts/setup_linux.py
      - name: Restore Linux compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ubuntu-24.04-ccache-${{ hashFiles('scripts/setup_linux.py', 'CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-24.04-ccache-${{ hashFiles('scripts/setup_linux.py', 'CMakeLists.txt', 'cmake/**') }}-
      - name: Build Linux compiler and both standard libraries
        id: build
        run: python -X utf8 scripts/build_linux.py
      - name: Create Linux release archive
        env:
          TXC_REF: ${{ github.ref_name }}
          TXC_REF_TYPE: ${{ github.ref_type }}
          TXC_COMMIT: ${{ github.sha }}
        run: python -X utf8 scripts/package_release.py
      - name: Verify extracted Linux package
        run: python -X utf8 scripts/check_linux_package.py
      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: txc-linux-x64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve Linux build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-diagnostics
          path: |
            build/linux/CMakeFiles/CMakeConfigureLog.yaml
            build/linux/CMakeCache.txt
            build/linux/compile_commands.json
          if-no-files-found: ignore
      - name: Save completed Linux compilation work
        if: always() && steps.build.outcome != 'skipped' && steps.compiler_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

  release:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: txc-*-x64
          path: artifacts
      - name: Verify and publish the built assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for platform in windows linux; do
            directory="artifacts/txc-${platform}-x64"
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
            cat "$directory/SHA256SUMS.txt" >> dist/SHA256SUMS.txt
          done
          cp artifacts/txc-windows-x64/*.zip dist/
          cp artifacts/txc-linux-x64/*.tar.gz dist/
          cd dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This tag already has a release; refusing to replace published assets.' >&2
            exit 1
          fi
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt \
            --verify-tag --title "TX Compiler $RELEASE_TAG" \
            --generate-notes "${options[@]}"
